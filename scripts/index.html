<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SVG Comparison</title>
  <style>
    body {
      margin: 0;
      font: 14px/1.4 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: #222;
      background: #f6f6f4;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 16px;
      padding: 12px 16px;
      background: #fff;
      border-bottom: 1px solid #d7d7d2;
    }

    h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 650;
    }

    .columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .label {
      font-weight: 650;
      color: #555;
    }

    main {
      padding: 16px;
    }

    .case {
      margin-bottom: 28px;
      border-top: 1px solid #d7d7d2;
    }

    .case h2 {
      margin: 10px 0;
      font-size: 14px;
      font-weight: 650;
    }

    .pair {
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
      gap: 16px;
      align-items: start;
    }

    .viewport {
      width: 100%;
      height: 520px;
      box-sizing: border-box;
      padding: 20px 48px;
      overflow: auto;
      border: 2px solid #a8a8a0;
      border-radius: 8px;
      background: #fff;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.12);
      overscroll-behavior: contain;
    }

    .svgHost {
      display: inline-block;
      box-sizing: border-box;
      min-width: max-content;
      min-height: max-content;
      padding: 20px 64px;
    }

    .svgHost svg {
      display: block;
      transform-origin: top left;
    }

    .svgHost .missing {
      display: block;
    }

    .empty {
      padding: 20px;
      background: #fff;
      border: 1px solid #d7d7d2;
    }
  </style>
</head>
<body>
  <header>
    <h1>SVG Comparison</h1>
    <div class="columns">
      <div class="label">out/original/</div>
      <div class="label">out/layout/</div>
    </div>
  </header>
  <main id="cases">
    <div class="empty">Run <code>scripts/test.nu</code>, then edit the <code>cases</code> array if your browser blocks directory listings.</div>
  </main>

  <script>
    const cases = [
      // "cluster_1.svg",
      // "html_table.svg",
    ];

    const root = document.getElementById("cases");

    loadCases();

    async function loadCases() {
      const names = cases.length > 0 ? cases : await listLayoutSvgs();
      if (names.length === 0) {
        return;
      }
      root.replaceChildren(...names.map(renderCase));
    }

    async function listLayoutSvgs() {
      try {
        const response = await fetch("out/layout/");
        const html = await response.text();
        return [...html.matchAll(/href="([^"]+\.svg)"/g)]
          .map((match) => decodeURIComponent(match[1].split("/").pop()))
          .filter(Boolean)
          .sort((a, b) => a.localeCompare(b));
      } catch {
        return [];
      }
    }

    function renderCase(name) {
      const section = document.createElement("section");
      section.className = "case";

      const title = document.createElement("h2");
      title.textContent = name;

      const pair = document.createElement("div");
      pair.className = "pair";
      pair.append(svgPane(`out/original/${name}`), svgPane(`out/layout/${name}`));

      section.append(title, pair);
      return section;
    }

    function svgPane(src) {
      const viewport = document.createElement("div");
      viewport.className = "viewport";

      const host = document.createElement("div");
      host.className = "svgHost";
      host.dataset.src = src;
      host.dataset.zoom = "1";
      host.textContent = "Loading...";
      viewport.append(host);
      viewport.addEventListener("wheel", zoomPane, { passive: false });

      loadSvg(host);
      return viewport;
    }

    async function loadSvg(host) {
      try {
        const response = await fetch(host.dataset.src);
        if (!response.ok) {
          throw new Error(`${response.status} ${response.statusText}`);
        }
        host.innerHTML = await response.text();
        applyZoom(host, Number(host.dataset.zoom));
      } catch (error) {
        host.innerHTML = `<span class="missing">Could not load ${host.dataset.src}: ${error.message}</span>`;
      }
    }

    function zoomPane(event) {
      if (!event.ctrlKey && !event.metaKey) {
        return;
      }

      event.preventDefault();

      const viewport = event.currentTarget;
      const host = viewport.querySelector(".svgHost");
      const currentZoom = Number(host.dataset.zoom);
      const nextZoom = Math.min(8, Math.max(0.15, currentZoom * Math.exp(-event.deltaY * 0.01)));
      const rect = viewport.getBoundingClientRect();
      const focusX = event.clientX - rect.left + viewport.scrollLeft;
      const focusY = event.clientY - rect.top + viewport.scrollTop;
      const ratio = nextZoom / currentZoom;

      host.dataset.zoom = String(nextZoom);
      applyZoom(host, nextZoom);

      viewport.scrollLeft = focusX * ratio - (event.clientX - rect.left);
      viewport.scrollTop = focusY * ratio - (event.clientY - rect.top);
    }

    function applyZoom(host, zoom) {
      const svg = host.querySelector("svg");
      if (!svg) {
        return;
      }

      const baseWidth = Number(svg.getAttribute("width")) || svg.viewBox.baseVal.width;
      const baseHeight = Number(svg.getAttribute("height")) || svg.viewBox.baseVal.height;

      svg.style.transform = `scale(${zoom})`;
      svg.style.marginRight = `${baseWidth * (zoom - 1)}px`;
      svg.style.marginBottom = `${baseHeight * (zoom - 1)}px`;
    }
  </script>
</body>
</html>
